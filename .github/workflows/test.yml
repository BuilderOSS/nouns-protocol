name: Run Tests
on: [push]

permissions:
  contents: read

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    environment: Test
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "yarn"

      - run: yarn install

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - run: yarn test:unit
