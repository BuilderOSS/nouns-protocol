[profile.default]
# CI pins foundry-rs/foundry-toolchain to Foundry v1.5.1; keep this compiler config fixed with that toolchain.
solc_version = '0.8.35'
libs = ['lib']
optimizer = true
optimizer_runs = 200
via_ir = true
out = 'dist/artifacts'
src = 'src'
test = 'test'
fs_permissions = [{ access = "read-write", path = "./"}]
ignored_warnings_from = ["node_modules/", "lib/"]

[fuzz]
runs = 500

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 150
quote_style = "double"
tab_width = 4

[lint]
# Suppress common naming convention warnings globally
exclude_lints = [
    "screaming-snake-case-immutable",
    "mixed-case-variable",
    "mixed-case-function",
    "pascal-case-struct",
    "screaming-snake-case-const",
    "unwrapped-modifier-logic",
    "asm-keccak256",
    "divide-before-multiply",
    "unsafe-typecast"
]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"
optimism_sepolia = "${OPTIMISM_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
optimism = { key = "${ETHERSCAN_API_KEY}", url = "https://api-optimistic.etherscan.io/api" }
optimism_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia-optimistic.etherscan.io/api" }
base = { key = "${ETHERSCAN_API_KEY}", url = "https://api.basescan.org/api/" }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api/" }
